; PlatformIO Project Configuration File
;
; Change the [env:...] board line to match your exact ESP32 board
; if PlatformIO's New Project screen picked a different name for you.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Baud rate the sketch uses for USB debug output.
; Must match the Serial.begin() value in main.cpp.
monitor_speed = 115200
